[project]
name = "pim-predecoder"
version = "0.1.0"
description = "PIM predecoder experiments and GEMV-gated residual calibration"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "numpy==2.4.4",
    "torch==2.11.0",
    "torchvision==0.26.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.uv]
package = false